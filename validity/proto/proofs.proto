syntax = "proto3";

package proofs;

// Service exposed by the validity proposer when it is built with the `agglayer`
// feature and `GRPC_ADDRESS` is set.
//
// In this mode the aggregation lifecycle is driven by an external coordinator
// rather than by the proposer's own loop: the coordinator decides which range to
// aggregate, asks for the proof here, and consumes it downstream. The proposer no
// longer submits aggregation proofs to L1, and still produces range proofs on its
// normal schedule.
service Proofs {
  // Request an aggregation proof over the range that follows `last_proven_block`.
  rpc RequestAggProof(AggProofRequest) returns (AggProofResponse);

  // Retrieve a mock aggregation proof previously stored by `RequestAggProof`.
  // Only meaningful when the proposer runs in mock mode.
  rpc GetMockProof(GetMockProofRequest) returns (GetMockProofResponse);
}

// Request for an aggregation proof.
message AggProofRequest {
  // Last block already proven on-chain; the aggregation starts just after it.
  uint64 last_proven_block = 1;
  // Desired end of the aggregation range. The proposer may return a shorter
  // range if fewer contiguous range proofs are available.
  uint64 requested_end_block = 2;
  // L1 block checkpointed for this aggregation proof.
  uint64 l1_block_number = 3;
  // Hex-encoded hash of `l1_block_number`, with or without a `0x` prefix.
  string l1_block_hash = 4;
}

// Response to an aggregation proof request.
message AggProofResponse {
  // Echo of the request's `last_proven_block`.
  uint64 last_proven_block = 1;
  // Actual end block covered by the proof, which may be lower than the
  // requested one.
  uint64 end_block = 2;
  // 32-byte big-endian identifier. In real mode this is the prover network
  // request id; in mock mode it is the database row id of the stored proof,
  // which can be passed to `GetMockProof`.
  bytes proof_request_id = 3;
}

// Request message for `GetMockProof`.
message GetMockProofRequest {
  // Database row id of the mock proof to retrieve.
  int64 proof_id = 1;
}

// Response message for `GetMockProof`.
message GetMockProofResponse {
  // Bincode-serialized mock proof.
  bytes proof = 1;
}
