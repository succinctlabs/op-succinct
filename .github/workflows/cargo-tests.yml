name: Cargo Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.cargo/**'
      - '.github/workflows/cargo-tests.yml'
      - '.github/workflows/integration-tests.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'justfile'
      - 'tests/**'
      - 'contracts/**'
      - 'fault-proof/**'
      - 'bindings/**'
      - 'configs/**'
      - 'elf/**'
      - 'programs/**'
      - 'scripts/**'
      - 'utils/**'
      - 'validity/**'

  push:
    branches:
      - main
    tags:
      - "v[0-9]+.*"
    paths-ignore:
      - "**/*.md"
      - "**/*.pdf"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  tests:
    runs-on:
      - runs-on
      - runner=64cpu-linux-x64
      # Use a compatible glibc for the bundled PostgreSQL test binary.
      - image=ubuntu24-full-x64
      - run-id=${{ github.run_id }} 
      - spot=false
      - disk=large
    timeout-minutes: 90
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly-d592b3e0f142d694c3be539702704a4a73238773
    - run: rustup toolchain install stable --profile minimal
    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Install Go
      run: |
        GO_ARCH=$(dpkg --print-architecture)
        curl -LO https://go.dev/dl/go1.24.0.linux-${GO_ARCH}.tar.gz
        sudo tar -C /usr/local -xzf go1.24.0.linux-${GO_ARCH}.tar.gz
        echo "/usr/local/go/bin" >> $GITHUB_PATH
    - uses: Swatinem/rust-cache@v2
    - name: Install SP1 toolchain
      run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v 6.8.1
          ~/.sp1/bin/cargo-prove prove --version
          source ~/.bashrc

    - name: Install just
      uses: extractions/setup-just@v3

    - name: Test
      run: just tests

    - name: Test AggLayer validity
      run: cargo test -p op-succinct-validity --release --features agglayer --lib
