name: Fork Token Probe

on:
  pull_request:
    paths:
      - '.github/workflows/fork-report-probe.yml'

jobs:
  check-fork-token:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      # Leave permissions unspecified to test the repository default on a real fork PR.
      - uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                body: 'Fork token probe: this automatic comment means the fork token unexpectedly has write access.',
              });
            } catch (error) {
              if (error.status !== 403) throw error;
              core.info('CONFIRMED: the real fork GITHUB_TOKEN cannot create a PR comment (HTTP 403).');
              return;
            }
            throw new Error('Expected a read-only fork token, but comment creation succeeded.');
