name: Build OP Succinct Docker Images

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**/*.pdf'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build Docker Images
    runs-on:
      - runs-on
      - runner=64cpu-linux-x64
      - run-id=${{ github.run_id }}
      - disk=large
      - spot=false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check Docker SP1 version
        run: |
          SP1_VERSION=$(grep 'sp1-sdk' Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$SP1_VERSION" ]; then
            echo "::error::Could not read the SP1 SDK version from Cargo.toml"
            exit 1
          fi

          MISMATCHES=$(grep -rn 'sp1up -v' --include='Dockerfile*' | grep -vF "$SP1_VERSION" || true)
          if [ -n "$MISMATCHES" ]; then
            echo "::error::Dockerfile SP1 versions must match Cargo.toml ($SP1_VERSION):"
            echo "$MISMATCHES"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta for op-succinct
        id: meta-succinct
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/op-succinct
          tags: |
            type=ref,event=tag
            type=sha

      - name: Docker meta for op-succinct-altda
        id: meta-succinct-altda
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/op-succinct-altda
          tags: |
            type=ref,event=tag
            type=sha

      - name: Docker meta for op-succinct-celestia
        id: meta-succinct-celestia
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/op-succinct-celestia
          tags: |
            type=ref,event=tag
            type=sha

      - name: Docker meta for op-succinct-eigenda
        id: meta-succinct-eigenda
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/op-succinct-eigenda
          tags: |
            type=ref,event=tag
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push op-succinct
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validity/Dockerfile
          push: true
          tags: ${{ steps.meta-succinct.outputs.tags }}
          labels: ${{ steps.meta-succinct.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push op-succinct-altda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validity/Dockerfile.altda
          push: true
          tags: ${{ steps.meta-succinct-altda.outputs.tags }}
          labels: ${{ steps.meta-succinct-altda.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push op-succinct-celestia
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validity/Dockerfile.celestia
          push: true
          tags: ${{ steps.meta-succinct-celestia.outputs.tags }}
          labels: ${{ steps.meta-succinct-celestia.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push op-succinct-eigenda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validity/Dockerfile.eigenda
          push: true
          tags: ${{ steps.meta-succinct-eigenda.outputs.tags }}
          labels: ${{ steps.meta-succinct-eigenda.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
