name: Cycle Count Diff

on:
  pull_request:
    paths:
      - 'elf/range-elf-embedded'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  cycle-count-diff:
    runs-on:
      - runs-on
      - cpu=32
      - ram=128
      - family=m7a+m7i-flex
      - image=ubuntu22-full-x64
      - run-id=${{ github.run_id }}
      - disk=large
      - spot=false
      
    steps:
      - name: Checkout Repository (for local actions)
        uses: actions/checkout@v4

      - name: Setup CI
        uses: ./.github/actions/setup
        with:
           submodules: recursive
      
      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v 6.2.4
          ~/.sp1/bin/cargo-prove prove --version
          source ~/.bashrc

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-d592b3e0f142d694c3be539702704a4a73238773

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: new_code
          submodules: recursive

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: old_code
          submodules: recursive

      - name: Check execution witness RPC
        env:
          L2_RPC: ${{ secrets.L2_RPC }}
        run: |
          set -euo pipefail
          host=$(python3 -c 'import os, urllib.parse; print(urllib.parse.urlsplit(os.environ["L2_RPC"]).hostname)')
          chain_id=$(curl --silent --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
            "$L2_RPC" | jq -r '.result')
          echo "L2_RPC: host=$host chain_id=$chain_id"

          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl --silent --show-error \
            --connect-timeout 5 \
            --max-time 15 \
            --output "$body" \
            --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"debug_executePayload","params":[]}' \
            "$L2_RPC")
          code=$(jq -r '.error.code // empty' "$body")
          message=$(jq -r '.error.message // empty' "$body")
          echo "debug_executePayload: http=$status error_code=$code error=$message"

          normalized=${message,,}
          if [[ "$status" == 401 || "$status" == 403 ||
                "$code" == -32601 || "$code" == -32001 ||
                "$normalized" == *"not available"* ||
                "$normalized" == *"method not found"* ]]; then
            echo "L2_RPC does not expose debug_executePayload"
            exit 1
          fi

      - name: Run Test On New Branch
        timeout-minutes: 30
        run: |
          RUST_LOG=host_backend=debug,info NEW_BRANCH=true cargo test test_cycle_count_diff --release -- --exact --nocapture
        working-directory: ./new_code
        env:
          L2_NODE_RPC: ${{ secrets.L2_NODE_RPC }}
          L1_RPC: ${{ secrets.L1_RPC }}
          L1_BEACON_RPC: ${{ secrets.L1_BEACON_RPC }}
          L2_RPC: ${{ secrets.L2_RPC }}

      - name: Copy Stats File For Old Branch
        run: |
          STATS_FILE=$(find ${{ github.workspace }}/new_code -name "new_cycle_stats.json" -type f | head -1)
          cp "$STATS_FILE" ${{ github.workspace }}/old_code/scripts/prove/new_cycle_stats.json
          cp ${{ github.workspace }}/new_code/scripts/prove/tests/cycle_count_diff.rs \
            ${{ github.workspace }}/old_code/scripts/prove/tests/cycle_count_diff.rs

      - name: Run Test On Old Branch
        timeout-minutes: 30
        run: |
          RUST_LOG=host_backend=debug,info NEW_BRANCH=false cargo test test_cycle_count_diff --release -- --exact --nocapture
        working-directory: ./old_code
        env:
          L2_NODE_RPC: ${{ secrets.L2_NODE_RPC }}
          L1_RPC: ${{ secrets.L1_RPC }}
          L1_BEACON_RPC: ${{ secrets.L1_BEACON_RPC }}
          L2_RPC: ${{ secrets.L2_RPC }}

      - name: Compare Results And Post To Github
        run: |
          RUST_LOG=info cargo test --test cycle_count_diff test_post_to_github -- --exact --nocapture
        working-directory: ./old_code
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TO_GITHUB: ${{ github.event_name == 'pull_request' }}
