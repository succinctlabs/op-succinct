name: Cycle Count Diff

on:
  pull_request:
    paths:
      - 'elf/range-elf-embedded'
      - '.github/workflows/cycle-count-diff.yml'
      - 'scripts/prove/tests/cycle_count_diff.rs'
      - 'tests/rust/**'
      - 'tests/justfile'
      - 'justfile'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

jobs:
  cycle-count-diff:
    runs-on:
      - runs-on
      - cpu=32
      - ram=128
      - family=m7a+m7i-flex
      - image=ubuntu22-full-x64
      - run-id=${{ github.run_id }}
      - disk=large
      - spot=false
      
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout Repository (for local actions)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Setup CI
        uses: ./.github/actions/setup-e2e-sysgo
      
      - name: Install SP1 toolchain
        run: |
          curl -L https://sp1.succinct.xyz | bash
          ~/.sp1/bin/sp1up -v 6.8.1
          ~/.sp1/bin/cargo-prove prove --version
          source ~/.bashrc

      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: old_code
          submodules: recursive

      - name: Compare both branches against local Sysgo
        run: RUST_LOG=info just cycle-count-diff old_code

      - name: Add performance report to summary
        run: cat scripts/prove/cycle_count_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-count-diff
          path: |
            scripts/prove/*_cycle_stats.json
            scripts/prove/cycle_count_heads.json
            scripts/prove/cycle_count_report.md

      - uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: scripts/prove/cycle_count_report.md
          if-no-files-found: error
          overwrite: true
